name: Publish

# FROZEN 2026-09-23. This package is published and is deliberately held at its
# current version while SynOI moves to a commercial model. Publishing on a
# version tag is removed so a routine release tag cannot ship a new public
# version by accident. workflow_dispatch is kept so a deliberate, human
# publish is still possible.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
